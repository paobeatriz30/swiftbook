<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SwiftBook — Professional estimating and invoicing for contractors. Quote it. Invoice it. Close it." />
    <meta name="theme-color" content="#0D0D0D" />

    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="SwiftBook" />
    <meta property="og:description" content="Quote it. Invoice it. Close it. The professional estimating platform for contractors." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getswiftbook.app" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>SwiftBook — Quote it. Invoice it. Close it.</title>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0D0D0D;
        color: #FFFFFF;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }

      /* Loading screen */
      #loading {
        position: fixed;
        inset: 0;
        background: #0D0D0D;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .loading-diamond {
        width: 40px;
        height: 40px;
        border: 2px solid #C9A84C;
        transform: rotate(45deg);
        border-radius: 4px;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .loading-diamond::after {
        content: '';
        position: absolute;
        inset: 8px;
        background: #C9A84C;
        border-radius: 2px;
        transform: rotate(0deg);
      }
      .loading-text {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        color: #555;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: rotate(45deg) scale(1); }
        50% { opacity: 0.6; transform: rotate(45deg) scale(0.95); }
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0D0D0D; }
      ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #3A3A3A; }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading">
      <div class="loading-diamond"></div>
      <div class="loading-text">SwiftBook</div>
    </div>

    <!-- App root -->
    <div id="root"></div>

    <!-- Main app script -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hide loading screen when app loads -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) loading.classList.add('hidden');
        }, 800);
      });
    </script>
  </body>
</html>
